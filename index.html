<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High-Low Card Game</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <main>
    <h1>High-Low Card Game</h1>
    <div class="container">
      <div class="card-container">
        <div class="card" id="current-card"></div>
      </div>
      <div id="score">Score: 0</div>
      <div class="buttons">
        <button id="higher-btn">Higher</button>
        <button id="lower-btn">Lower</button>
      </div>
      <div class="card-container">
        <div class="card" id="next-card"></div>
      </div>
      <div id="message"></div>
      <button id="restart-btn" style="display: none;">Play Again</button>
    </div>
  </main>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
